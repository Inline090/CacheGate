name: cachegate

services:
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cachegate
      POSTGRES_PASSWORD: cachegate
      POSTGRES_DB: cachegate
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cachegate']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
